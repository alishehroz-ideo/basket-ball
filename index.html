<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Web Player | Basket Ball Dunk</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e0e12;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        /* Key art, pre-blurred into the JPG (Tools/bake_loading_bg.py) — never a CSS
           blur, which is far too expensive while the wasm is downloading. `cover`,
           never `100% 100%`: cover crops, stretch distorts in a letterboxed viewport.
           #0e0e12 stays underneath as the fallback until the JPG lands, and is what
           paints the letterbox bars. */
        background: #0e0e12 url('TemplateData/loading-bg.jpg') center / cover no-repeat;
      }
      /* Canvas is positioned by JS (letterbox). Must stay TRANSPARENT so the backdrop
         shows through while loading; Unity fills it once the game renders. !important
         beats TemplateData/style.css's `#unity-canvas { background: BACKGROUND_COLOR }`,
         which matches at equal specificity and would otherwise hide the backdrop. */
      #unity-canvas {
        display: block;
        position: absolute;
        background: transparent !important;
      }
      #unity-logo {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 0 auto 12px;
        background: none;   /* static icon painted only on fallback (JS adds .gb-fallback) */
      }
      #unity-logo.gb-fallback {
        background: url('TemplateData/game-icon.jpg') center / contain no-repeat;
      }
      /* Per-game tenant icon (GameBull /context), layered on top; revealed only after decode. */
      #gb-tenant-logo {
        position: absolute;
        inset: 0;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        opacity: 0;
        transition: opacity .25s ease;
      }
      #gb-tenant-logo.gb-ready { opacity: 1; }
      /* Spinner centred inside the 180px icon box while /context is in flight. */
      #gb-spinner {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border: 4px solid rgba(255,255,255,0.18);
        border-top-color: #7FA8D4;
        border-radius: 50%;
        animation: gb-spin 0.8s linear infinite;
      }
      @keyframes gb-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #gb-spinner { animation-duration: 3s; }
      }
      /* Custom rounded progress bar — overrides PNG images from style.css */
      #unity-progress-bar-empty {
        width: 300px;
        height: 18px;
        background: #d9d9d9 !important;
        background-image: none !important;
        border-radius: 9px;
        overflow: hidden;
        margin: 12px auto 0;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #1C3A5B !important;
        background-image: none !important;
        margin-top: 0 !important;
        border-radius: 9px;
        transition: width 0.1s ease;
      }
      #unity-progress-percent {
        text-align: center;
        color: #F2F2F2;
        font-size: 14px;
        font-family: arial, sans-serif;
        margin-top: 6px;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 5%;
        transform: translate(-50%);
        background: white;
        padding: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">
          <div id="gb-tenant-logo"></div>
          <div id="gb-spinner"></div>
        </div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-progress-percent">0%</div>
      </div>
      <div id="unity-warning"> </div>

    </div>
    <script>
      // ===== Tenant loading icon (GameBull /context) ================================
      // Reads customization.gameLogoUrl from /context BEFORE Unity boots, so the loading
      // screen shows THIS game's own icon while the build downloads. Fully optional and
      // fire-and-forget: nothing here awaits, so the Unity download is never delayed, and
      // every failure path falls back to the static TemplateData/game-icon.jpg.
      (function loadTenantIcon() {
        var DEFAULT_API_BASE = "https://api.g-b.store";   // production; staging passes ?apiBase=
        var DEFAULT_GAME_ID  = "BASKET_BALL";                     // fallback only; ?gameId= from URL wins
        var FETCH_TIMEOUT_MS = 4000;

        var spinner = document.querySelector("#gb-spinner");
        var target  = document.querySelector("#gb-tenant-logo");
        var iconBox = document.querySelector("#unity-logo");

        // Could not resolve a per-game logo: stop spinning and paint the static game icon,
        // so the loading screen never sits on an endless spinner or an empty box.
        function fallback() {
          if (iconBox) iconBox.classList.add("gb-fallback");
          stopSpinner();
        }
        function stopSpinner() {
          if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner);
        }

        try {
          var q = new URLSearchParams(window.location.search);

          // Same precedence the C# SDK uses: sessionToken -> bootToken -> token.
          var token      = q.get("sessionToken") || q.get("bootToken") || q.get("token");
          var tenantSlug = q.get("tenantSlug");
          var apiBase    = (q.get("apiBase") || DEFAULT_API_BASE).replace(/\/+$/, "");
          var gameId     = q.get("gameId") || DEFAULT_GAME_ID;

          // No credentials -> nothing to fetch. Not an error; just keep the static icon.
          if (!tenantSlug || !token) { fallback(); return; }

          // AbortController so a hung API can never pin the spinner on screen.
          var ctrl  = ("AbortController" in window) ? new AbortController() : null;
          var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, FETCH_TIMEOUT_MS);

          var url = apiBase + "/play/games/" + encodeURIComponent(gameId) +
                    "/context?tenantSlug=" + encodeURIComponent(tenantSlug);

          fetch(url, {
            method: "GET",
            headers: { "Authorization": "Bearer " + token },
            signal: ctrl ? ctrl.signal : undefined
          })
            .then(function (r) { return r.ok ? r.json() : null; })   // 401/404 -> null -> fallback
            .then(function (data) {
              clearTimeout(timer);
              var c = data && data.customization;

              // PER-GAME icon only: customization.gameLogoUrl preferred, gameBannerUrl second.
              // NEVER logoUrl / tenantLogoUrl / assets[] / __logo__ — those are tenant-wide and
              // have surfaced a DIFFERENT game's logo on shared tenants. Absent -> static icon.
              var iconUrl =
                (c && typeof c.gameLogoUrl   === "string" && c.gameLogoUrl)   ? c.gameLogoUrl   :
                (c && typeof c.gameBannerUrl === "string" && c.gameBannerUrl) ? c.gameBannerUrl : null;

              if (!iconUrl || !target) { fallback(); return; }

              // Preload and only reveal once decoded, so a broken/slow URL never flashes.
              var img = new Image();
              img.crossOrigin = "anonymous";
              img.onload = function () {
                target.style.backgroundImage = 'url("' + iconUrl.replace(/"/g, '%22') + '")';
                target.classList.add("gb-ready");
                stopSpinner();       // icon is up — stop spinning, do NOT add the static icon
              };
              img.onerror = fallback;
              img.src = iconUrl;
            })
            .catch(function () { clearTimeout(timer); fallback(); });   // network / abort / CORS / timeout
        } catch (e) {
          fallback();   // URLSearchParams or fetch unavailable
        }
      })();

      // ── Responsive letterbox ────────────────────────────────────────────────
      var GAME_ASPECT = 1080 / 1920;

      function resizeCanvas() {
        var canvas = document.getElementById('unity-canvas');
        var availW = window.innerWidth;
        var availH = window.innerHeight;
        var w, h;
        if (availW / availH > GAME_ASPECT) {
          h = availH; w = Math.round(h * GAME_ASPECT);
        } else {
          w = availW; h = Math.round(w / GAME_ASPECT);
        }
        canvas.style.width  = w + 'px';
        canvas.style.height = h + 'px';
        canvas.style.left   = Math.round((availW - w) / 2) + 'px';
        canvas.style.top    = Math.round((availH - h) / 2) + 'px';
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ── Unity banner helper ─────────────────────────────────────────────────
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // ── Unity build config ──────────────────────────────────────────────────
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build.loader.js";
      var config = {
        arguments: [],
        dataUrl:      buildUrl + "/build.data",
        frameworkUrl: buildUrl + "/build.framework.js",
        codeUrl:      buildUrl + "/build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:    "ASN Games",
        productName:    "Basket Ball Dunk",
        productVersion: "2",
        matchWebGLToCanvasSize: true,
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      function setLoadProgress(p) {
        document.querySelector("#unity-progress-bar-full").style.width = Math.round(p * 100) + "%";
        document.querySelector("#unity-progress-percent").innerText = Math.round(p * 100) + "%";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(document.querySelector("#unity-canvas"), config, setLoadProgress)
        .then((unityInstance) => {
          setLoadProgress(1);

          // Remove EVERY loading-UI element (incl. the dynamic tenant icon + spinner) from the
          // DOM. Safari/WebKit keeps painting them even after display:none on a parent, so we
          // remove them outright. This is the existing teardown, extended to the new elements.
          function killEl(sel) {
            var el = document.querySelector(sel);
            if (!el) return;
            el.style.display = "none";
            el.style.visibility = "hidden";
            el.style.opacity = "0";
            el.style.backgroundImage = "none";   // kill any background image (static or tenant icon)
            if (el.parentNode) el.parentNode.removeChild(el);
          }
          killEl("#gb-spinner");         // dynamic-icon additions must be torn down too,
          killEl("#gb-tenant-logo");     // or Safari keeps painting them over the game
          killEl("#unity-logo");
          killEl("#unity-progress-bar-full");
          killEl("#unity-progress-bar-empty");
          killEl("#unity-progress-percent");
          killEl("#unity-loading-bar");

          resizeCanvas();

          // ── Bridge: tell the parent the game is ready ─────────────────────
          window.parent.postMessage({ type: 'game:ready' }, '*');

          // ── Bridge: listen for campaign:init from parent ──────────────────
          window.addEventListener('message', function(event) {
            var msg = event.data;
            if (!msg || msg.type !== 'campaign:init') return;
            var cfg = msg.config || {};
            if (cfg.ballImage) {
              unityInstance.SendMessage('Bridge', 'SetBallImage', cfg.ballImage);
            }
          });

          // ── Self-test: ?ballTest=1 generates a solid-color circle ─────────
          if (new URLSearchParams(window.location.search).get('ballTest') === '1') {
            var size = 256;
            var c = document.createElement('canvas');
            c.width = c.height = size;
            var ctx = c.getContext('2d');
            // Hot-pink circle on transparent background — easy to spot
            ctx.clearRect(0, 0, size, size);
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2);
            ctx.fillStyle = '#FF2D78';
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 8;
            ctx.stroke();
            unityInstance.SendMessage('Bridge', 'SetBallImage', c.toDataURL('image/png'));
          }

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
